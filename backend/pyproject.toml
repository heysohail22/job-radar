[project]
name = "ai-job-radar-backend"
version = "0.2.0"
description = "One Python API and LangGraph job collection service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.143.3", "uvicorn==0.54.0", "httpx==0.28.1", "aiohttp==3.14.5", "beautifulsoup4==4.15.0",
  "pydantic-settings==2.16.0", "langgraph==1.2.16", "langchain-groq==1.1.3", "langchain-google-genai==4.4.2",
]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_python"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
