[project]
name = "ai-job-radar-backend"
version = "0.2.0"
description = "One Python API and LangGraph job collection service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi", "uvicorn", "httpx", "aiohttp", "beautifulsoup4",
  "pydantic-settings", "langgraph", "langchain-groq", "langchain-google-genai",
]
[dependency-groups]
dev = ["pytest", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_python"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
